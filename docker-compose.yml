version: '3.8'

services:
  # PostgreSQL Veritabanı Servisi
  postgres:
    image: postgres:16-alpine
    container_name: gin_postgres_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Gin Backend Servisi
  app:
    build: .
    container_name: gin_app
    restart: always
    ports:
      - "8080"
    env_file:
      - .env
    volumes:
      - .:/app
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=mydatabase
    depends_on:
      - postgres

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "8080:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app




volumes:
  postgres_data:
  caddy_data:
  caddy_config: